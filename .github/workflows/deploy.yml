name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject Gist token from Secrets
        run: |
          python3 -c "
import os
t=os.environ.get('GIST_TOKEN','')
with open('index.html','r') as f: c=f.read()
c=c.replace('__GIST_TOKEN__',t)
with open('index.html','w') as f: f.write(c)
print('injected',len(t),'chars')
"
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
